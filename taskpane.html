<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning SAV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script>(function(){var t="light";try{t=localStorage.getItem("sav_theme")||"light"}catch(e){}if(t!=="auto")document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
/* Panneau Excel : barre noire, onglets, contenu béton. Grille semaine si le panneau est large, liste par jour s'il est étroit. */
:root{
  --bg:#E2E3E0; --surface:#F0F0ED; --surface-2:#D6D7D3; --ink:#151615; --ink-2:#5A5D58; --line:#C2C4BF;
  --bar:#151615; --bar-ink:#EDEDEA; --bar-ink-2:#9A9D97;
  --btn:#151615; --btn-ink:#F0F0ED; --btn-2:#D6D7D3; --btn-2-ink:#151615;
  --signal:#F2B200; --signal-ink:#151615; --danger:#A8261C; --danger-bg:#F3DCD9; --ok:#2E6A3A; --ok-bg:#DCEBDD; --info:#24508F; --info-bg:#DCE5F3;
  --card-s:40%; --card-l:85%; --card-ink:#151615; --card-ink-2:#3F423E;
  --shadow:0 10px 30px rgba(0,0,0,.18);
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1B1A; --surface:#232523; --surface-2:#2D2F2D; --ink:#E8E9E5; --ink-2:#A2A59F; --line:#3A3D39;
  --bar:#0E0F0E; --bar-ink:#E8E9E5; --bar-ink-2:#8E918B;
  --btn:#E8E9E5; --btn-ink:#151615; --btn-2:#2F322F; --btn-2-ink:#E8E9E5;
  --danger:#F08A80; --danger-bg:#3A2221; --ok:#7FC48B; --ok-bg:#1F3322; --info:#8FB4F0; --info-bg:#1E2A3C;
  --card-s:22%; --card-l:25%; --card-ink:#EDEEEA; --card-ink-2:#B9BCB6; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1B1A; --surface:#232523; --surface-2:#2D2F2D; --ink:#E8E9E5; --ink-2:#A2A59F; --line:#3A3D39;
  --bar:#0E0F0E; --bar-ink:#E8E9E5; --bar-ink-2:#8E918B;
  --btn:#E8E9E5; --btn-ink:#151615; --btn-2:#2F322F; --btn-2-ink:#E8E9E5;
  --danger:#F08A80; --danger-bg:#3A2221; --ok:#7FC48B; --ok-bg:#1F3322; --info:#8FB4F0; --info-bg:#1E2A3C;
  --card-s:22%; --card-l:25%; --card-ink:#EDEEEA; --card-ink-2:#B9BCB6; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--ink-2)}
.miss{color:var(--danger);font-style:italic}
h2,h3{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.03em;margin:0}

.head{position:sticky;top:0;z-index:20}
.bar{background:var(--bar);color:var(--bar-ink);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar b{font-family:var(--f-head);font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin-right:auto}
.sync{font-size:12px;color:var(--bar-ink-2);display:flex;align-items:center;gap:5px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.save::before{background:var(--signal)} .sync.err::before{background:var(--danger)} .sync.demo::before{background:var(--bar-ink-2)}
.bar .ib{background:#2B2D2B;color:var(--bar-ink);border:0;border-radius:4px;padding:5px 9px;cursor:pointer;font-weight:600;font-size:13px}
.bar .ib:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--bar);padding:0 8px;scrollbar-width:none}
.tab{background:none;border:0;color:var(--bar-ink-2);padding:7px 10px;font-family:var(--f-head);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap;border-radius:4px 4px 0 0}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab .badge{margin-left:4px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--signal);color:var(--signal-ink);font-size:11px;font-weight:700;font-family:var(--f-body)}
main{padding:12px;display:flex;flex-direction:column;gap:12px}
.demobar{background:var(--signal);color:var(--signal-ink);padding:8px 12px;border-radius:4px;font-size:13px}

.btn{border:0;border-radius:4px;padding:7px 12px;font-weight:600;cursor:pointer;background:var(--btn);color:var(--btn-ink);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--btn-2);color:var(--btn-2-ink)}
.btn.signal{background:var(--signal);color:var(--signal-ink)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:12px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
input[type=date],input[type=text],input[type=number],input[type=search],input[type=tel],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:64px}
.iconbtn{width:32px;height:32px;border:0;border-radius:4px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:16px;cursor:pointer}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-family:var(--f-head);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

/* Semaine */
.whead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.whead h2{font-size:30px;line-height:1}
.whead .rng{color:var(--ink-2);font-size:13px}
.whead .nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.alerts{margin:0}
.alerts summary{cursor:pointer;font-weight:600;color:var(--danger)}
.alerts ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table.wk{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;table-layout:fixed}
table.wk th,table.wk td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;padding:5px}
table.wk thead th{background:var(--bar);color:var(--bar-ink);text-align:left;font-family:var(--f-head);font-size:15px;text-transform:uppercase;letter-spacing:.03em}
table.wk thead th small{display:block;font-family:var(--f-mono);font-size:10px;font-weight:400;opacity:.8;text-transform:none}
table.wk thead th.today{background:var(--signal);color:var(--signal-ink)}
table.wk thead th.fer{background:repeating-linear-gradient(135deg,var(--bar) 0 6px,#555 6px 9px)}
table.wk th.who{width:96px;background:var(--surface-2);color:var(--ink);text-align:left}
table.wk tbody th.who{font-family:var(--f-head);font-size:18px}
table.wk tbody th.who small{display:block;font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--ink-2);text-transform:none}
td.cell{min-height:80px}
td.cell.today{background:color-mix(in srgb,var(--signal) 9%,transparent)}
td.cell.fer{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--ink) 6%,transparent) 8px 12px)}
.stack{display:flex;flex-direction:column;gap:5px}
.add{border:1px dashed var(--line);background:transparent;border-radius:4px;color:var(--ink-2);cursor:pointer;padding:4px;font-size:12px;width:100%}
.add:hover{border-color:var(--ink);color:var(--ink)}
.absent{border-radius:4px;padding:5px 7px;font-size:12px;font-weight:600;background:repeating-linear-gradient(135deg,var(--surface-2) 0 7px,transparent 7px 12px);border:1px solid var(--line);cursor:pointer;text-align:left}
.card{position:relative;border-radius:4px;padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;
  background:hsl(var(--h) var(--card-s) var(--card-l));color:var(--card-ink);border:1px solid transparent}
.card:hover{border-color:var(--ink)}
.card .top{display:flex;gap:5px;align-items:center;font-family:var(--f-mono);font-size:10px;color:var(--card-ink-2)}
.card .z{border:1px solid currentColor;border-radius:3px;padding:0 3px}
.card .warn{margin-left:auto;background:var(--danger);color:#fff;border-radius:50%;width:15px;height:15px;display:grid;place-items:center;font-family:var(--f-body);font-weight:800;font-size:11px}
.card .nm{font-weight:700;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.card .rm{font-size:12px;color:var(--card-ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.card .ft{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:11px;flex-wrap:wrap}
.card .vh{font-weight:600}
.pill{display:inline-block;border-radius:3px;padding:0 5px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.st-Confirme{background:var(--info-bg);color:var(--info)}
.st-Fait{background:var(--ok-bg);color:var(--ok)}
.st-Rapport-recu{background:var(--ink);color:var(--bg)}
.st-Annule{background:var(--danger-bg);color:var(--danger)}
.card.annule .nm{text-decoration:line-through}
.card.dim{opacity:.35}
.card.dragging{opacity:.4}
.dropok{outline:2px solid var(--signal)!important;outline-offset:-2px}
/* liste par jour (panneau étroit) */
.day{display:flex;flex-direction:column;gap:6px}
.day h3{font-size:17px;display:flex;gap:8px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:2px}
.day h3.today{border-color:var(--signal)}
.day h3 small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-2);font-weight:500}
.orow{display:grid;grid-template-columns:54px 1fr;gap:6px;align-items:start}
.orow .on{font-family:var(--f-head);font-weight:700;font-size:16px;padding-top:4px}

/* Mois */
table.mo{border-collapse:collapse;width:100%;min-width:620px;table-layout:fixed}
table.mo th{font-family:var(--f-head);text-transform:uppercase;font-size:13px;text-align:left;padding:4px;background:var(--bar);color:var(--bar-ink)}
table.mo td{border:1px solid var(--line);vertical-align:top;height:96px;padding:3px;background:var(--surface)}
table.mo td.out{background:transparent;opacity:.5}
table.mo td.fer{background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--surface-2) 8px 12px)}
table.mo td.today{box-shadow:inset 0 0 0 2px var(--signal)}
.dn{font-family:var(--f-mono);font-size:11px;font-weight:600;background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2)}
.ml{display:block;width:100%;text-align:left;border:0;border-radius:3px;margin-top:2px;padding:1px 4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:hsl(var(--h) var(--card-s) var(--card-l));color:var(--card-ink)}
.ml.ab{background:var(--surface-2);color:var(--ink-2);font-style:italic}

/* Listes */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:4px}
table.list{border-collapse:collapse;width:100%}
table.list th{text-align:left;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.04em;font-size:13px;background:var(--surface-2);padding:6px 8px;white-space:nowrap}
table.list td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top;font-size:13px}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
table.list input,table.list select{width:100%}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px}
.dcard.u-Haute{border-left:4px solid var(--danger)}
.dcard h3{font-size:16px;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:700}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.kpi b{display:block;font-family:var(--f-head);font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-2)}
.cols{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:16px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;min-width:0}
.cols .c i{display:block;width:100%;background:var(--ink);border-radius:2px 2px 0 0;min-height:1px}
.cols .c em{font-style:normal;font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cols .c small{font-size:10px;color:var(--ink-2)}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:6px;align-items:center;font-size:12px}
.hb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .b{height:12px;background:var(--surface-2);border-radius:2px;overflow:hidden;position:relative}
.hb .b i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.hb .b i.over{background:var(--danger)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums}

/* Tiroir / modale */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet header{background:var(--ink);color:var(--bg);padding:10px 14px;display:flex;gap:8px;align-items:flex-start}
.sheet header h2{font-size:21px;line-height:1.05}
.sheet header p{margin:2px 0 0;font-size:12px;opacity:.75}
.sheet header .x{margin-left:auto;background:none;border:0;color:inherit;font-size:24px;line-height:1;cursor:pointer}
.sheet .body{padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.sheet footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opts{list-style:none;margin:4px 0 0;padding:0;max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.opts:empty{display:none}
.opts li{padding:6px 8px;cursor:pointer;display:flex;gap:6px;align-items:baseline;border-top:1px solid var(--line);font-size:13px}
.opts li:first-child{border-top:0}
.opts li:hover,.opts li.act{background:var(--surface-2)}
.opts li em{margin-left:auto;font-style:normal;font-size:11px;color:var(--ink-2)}
dl.info{background:var(--bg);border-radius:4px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:13px}
dl.info dt{color:var(--ink-2)}
dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:3px 10px;cursor:pointer;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.st[aria-pressed="true"].c-Fait{background:var(--ok);border-color:var(--ok);color:#fff}
.warnbox{background:var(--danger-bg);border-radius:4px;padding:8px 10px;font-size:13px}
.warnbox ul{margin:0;padding-left:16px}
.okbox{background:var(--ok-bg);border-radius:4px;padding:8px 10px;font-size:13px}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:12px}
.modal .box{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden}
.modal .box header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--ink);color:var(--bg)}
.modal .box header h2{font-size:19px}
.modal .box header .x{margin-left:auto;background:none;border:0;color:inherit;font-size:22px;cursor:pointer}
.modal .content{padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
pre.route{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--bg);padding:10px;border-radius:4px;margin:0;max-height:40vh;overflow:auto}
.hl{display:flex;gap:8px;align-items:baseline;border-top:1px solid var(--line);padding-top:6px;font-size:13px}
.hl:first-child{border-top:0;padding-top:0}
.hl .d{width:84px;flex:none;font-family:var(--f-mono);font-size:11px}
.hl .w{flex:1;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:4px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 24px);font-size:13px}
.center{padding:30px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.center h2{font-size:24px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sl .16s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="head"><div class="bar">
  <b>Planning SAV</b>
  <span class="sync demo" id="sync">Chargement…</span>
  <button class="ib" id="fullBtn" hidden title="Ouvrir le planning dans une grande fenêtre">Plein écran</button>
  <button class="ib" id="closeFullBtn" hidden title="Fermer la fenêtre plein écran">Fermer</button>
  <button class="ib" id="undoBtn" disabled title="Annuler la dernière action (Ctrl+Z)">Annuler</button>
  <button class="ib" id="reloadBtn" title="Recharger depuis Excel">Actualiser</button>
  <button class="ib" id="setBtn" title="Réglages">Réglages</button>
</div>
<nav class="tabs" role="tablist" id="tabs">
  <button class="tab" role="tab" data-view="week" aria-selected="true">Semaine</button>
  <button class="tab" role="tab" data-view="month" aria-selected="false">Mois</button>
  <button class="tab" role="tab" data-view="dem" aria-selected="false">Demandes<span class="badge" id="demCount" hidden></span></button>
  <button class="tab" role="tab" data-view="ch" aria-selected="false">Chantiers</button>
  <button class="tab" role="tab" data-view="res" aria-selected="false">Équipe</button>
  <button class="tab" role="tab" data-view="stats" aria-selected="false">Stats</button>
</nav></div>
<main id="main"><div class="center"><h2>Chargement…</h2></div></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden></aside>
<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true"><header><h2 id="mTitle"></h2><button class="x" id="mClose" aria-label="Fermer">×</button></header><div class="content" id="mBody"></div></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* =====================================================================
   Planning SAV — complément Excel (Office.js)
   Les données vivent dans les tableaux Excel du classeur Planning_SAV_3.0.
   ===================================================================== */
const $ = s => document.querySelector(s);
const DAY = 86400000, EPOCH = Date.UTC(1899, 11, 30);
const sDate = s => new Date(EPOCH + Math.floor(s) * DAY);
const toSerial = d => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / DAY);
const today = () => toSerial(new Date());
const nowStamp = () => { const d = new Date(); return (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) - EPOCH) / DAY; };
const dow = s => (sDate(s).getUTCDay() + 6) % 7;
const monOf = s => s - dow(s);

const OfficeStore = {
  calc: {}, headers: {},
  async loadAll() {
    return Excel.run(async ctx => {
      const req = {};
      for (const [t, T] of Object.entries(TBL)) {
        const tb = ctx.workbook.tables.getItemOrNullObject(T.name); tb.load("isNullObject");
        req[t] = { tb };
      }
      await ctx.sync();
      const missing = Object.entries(req).filter(([, r]) => r.tb.isNullObject).map(([t]) => TBL[t].name);
      if (missing.length) { const e = new Error("STRUCTURE"); e.missing = missing; throw e; }
      for (const [t, r] of Object.entries(req)) {
        r.h = r.tb.getHeaderRowRange().load("values");
        r.b = r.tb.getDataBodyRange().load("values");
        r.f = r.tb.getDataBodyRange().getRow(0).load("formulas");
      }
      await ctx.sync();
      const data = {};
      for (const [t, r] of Object.entries(req)) {
        const headers = r.h.values[0].map(String);
        this.headers[t] = headers;
        this.calc[t] = r.f.formulas[0].map(v => typeof v === "string" && v.startsWith("=") ? v : null);
        data[t] = rowsToRecs(t, headers, r.b.values);
      }
      return data;
    });
  },
  async apply(ops) {
    await Excel.run(async ctx => {
      const ts = [...new Set(ops.map(o => o.t))], m = {};
      for (const t of ts) {
        const T = TBL[t], tb = ctx.workbook.tables.getItem(T.name);
        m[t] = { tb, h: tb.getHeaderRowRange().load("values"), k: tb.columns.getItem(T.cols[T.key]).getDataBodyRange().load("values") };
        if (ops.some(o => o.t === t && o.op === "add")) m[t].first = tb.getDataBodyRange().getRow(0).load("values");
      }
      await ctx.sync();
      for (const t of ts) {
        const T = TBL[t], { tb } = m[t], headers = m[t].h.values[0].map(String);
        const keys = m[t].k.values.map(r => r[0]);
        const body = tb.getDataBodyRange();
        const col = f => { const i = headers.indexOf(T.cols[f]); if (i < 0) throw new Error(`Colonne « ${T.cols[f]} » introuvable.`); return i; };
        const find = k => { const i = keys.findIndex(x => sameKey(x, k)); if (i < 0) throw new Error(`Ligne « ${k} » introuvable dans ${T.name} : elle a peut-être été supprimée par un collègue. Actualisez.`); return i; };
        for (const o of ops.filter(o => o.t === t && o.op === "upd")) {
          const i = find(o.key);
          for (const [f, v] of Object.entries(o.patch)) { if ((T.calc || []).includes(f)) continue; body.getCell(i, col(f)).values = [[toCell(v)]]; }
        }
        const dels = ops.filter(o => o.t === t && o.op === "del").map(o => find(o.key)).sort((a, b) => b - a);
        for (const i of dels) tb.rows.getItemAt(i).delete();
        const adds = ops.filter(o => o.t === t && o.op === "add");
        if (adds.length) {
          const calc = this.calc[t] || [];
          const mk = rec => headers.map((h, c) => { const f = Object.keys(T.cols).find(k => T.cols[k] === h); if (calc[c] && (!f || (T.calc || []).includes(f))) return calc[c]; return f ? toCell(rec[f]) : ""; });
          let rest = adds;
          const firstVals = m[t].first.values[0];
          const blank = keys.length - dels.length === 1 && !dels.length && firstVals.every((v, c) => calc[c] || v === "" || v == null);
          if (blank) {
            const rec = adds[0].rec;
            for (const [f, h] of Object.entries(T.cols)) { if ((T.calc || []).includes(f)) continue; body.getCell(0, headers.indexOf(h)).values = [[toCell(rec[f])]]; }
            rest = adds.slice(1);
          }
          if (rest.length) tb.rows.add(null, rest.map(o => mk(o.rec)));
        }
      }
      await ctx.sync();
    });
  },
  watch(cb) {
    Excel.run(async ctx => { ctx.workbook.tables.onChanged.add(async ev => { cb(ev && ev.source); }); await ctx.sync(); }).catch(e => console.warn("onChanged indisponible", e));
  }
};

function inverseOf(ops) {
  const inv = [];
  for (const o of ops) {
    const T = TBL[o.t], cur = k => S.data[o.t].find(x => sameKey(x[T.key], k));
    if (o.op === "add") inv.push({ t: o.t, op: "del", key: o.t === "ch" ? `${o.rec.no} - ${o.rec.nom}` : o.rec[T.key] });
    else if (o.op === "del") { const c = cur(o.key); if (c) inv.push({ t: o.t, op: "add", rec: clone(c) }); }
    else { const c = cur(o.key); if (c) { const p = {}; for (const f of Object.keys(o.patch)) p[f] = c[f]; inv.push({ t: o.t, op: "upd", key: o.key, patch: p }); } }
  }
  return inv.reverse();
}
function applyLocal(ops) {
  for (const o of ops) {
    const T = TBL[o.t], arr = S.data[o.t];
    if (o.op === "add") { const r = clone(o.rec); if (o.t === "ch") r.key = `${r.no} - ${r.nom}`; arr.push(r); }
    else { const i = arr.findIndex(x => sameKey(x[T.key], o.key)); if (i < 0) continue; if (o.op === "upd") Object.assign(arr[i], o.patch); else arr.splice(i, 1); }
  }
  buildIndex();
}

  try {

    if (undoable) { S.undo.push({ label, ops: inv }); if (S.undo.length > 40) S.undo.shift(); }

}

    setSync("err", "Erreur de lecture"); toast("Lecture impossible : " + e.message, 6000);
  }
}

/* ---------- Rendu général ---------- */
function render() {
  if (!S.data) return;
  if (S.fullOpen) {
    $("#main").innerHTML = `<div class="center"><h2>Planning ouvert en plein écran</h2><p>Travaillez dans la grande fenêtre. <b>Gardez ce panneau ouvert</b> : c'est lui qui enregistre dans le classeur.</p><div class="row"><button class="btn" id="fullClose2">Fermer le plein écran</button></div></div>`;
    $("#fullClose2").onclick = () => { try { Bridge.dlg && Bridge.dlg.close(); } catch (e) { } onFullClosed(); };
    return;
  }
  $("#undoBtn").disabled = !S.undo.length;
  $("#undoBtn").title = S.undo.length ? "Annuler : " + S.undo[S.undo.length - 1].label : "Rien à annuler";
  const nd = S.data.dem.filter(d => d.statut === "En attente").length;
  $("#demCount").textContent = nd; $("#demCount").hidden = !nd;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === S.view));
  S.wide = $("#main").clientWidth >= 700;
  const v = { week: renderWeek, month: renderMonth, dem: renderDem, ch: renderCh, res: renderRes, stats: renderStats }[S.view] || renderWeek;
  const keep = window.scrollY; v(); window.scrollTo(0, keep);
}
const demoBanner = () => S.live ? "" : `<div class="demobar"><b>Aperçu avec des données d'exemple.</b> Dans Excel, le complément lit et écrit directement dans les tableaux du classeur Planning_SAV_3.0.</div>`;

function cardHTML(i) {
  const c = chOf(i.chantier), { no, name } = splitKey(i.chantier), w = conflicts(i);
  const dim = S.zone && String(c?.zone ?? "") !== S.zone;
  return `<button class="card${i.statut === "Annulé" ? " annule" : ""}${dim ? " dim" : ""}" data-int="${html(i.id)}" draggable="true" style="--h:${hueOf(i.chantier)}">
    <span class="top"><span>${html(no)}</span>${c && c.zone !== "" ? `<span class="z">Z${html(c.zone)}</span>` : ""}${w.length ? `<span class="warn" title="${html(w.join("\n"))}">!</span>` : ""}</span>
    <span class="nm">${html(name || i.chantier)}</span>
    ${i.remarques ? `<span class="rm">${html(i.remarques)}</span>` : ""}
    <span class="ft"><span class="pill st-${slug(i.statut)}">${html(i.statut || "Planifié")}</span>${i.vehicule ? `<span class="vh">${html(i.vehicule)}</span>` : ""}${i.heures !== "" ? `<span>${html(i.heures)} h</span>` : ""}</span>
  </button>`;
}
function weekOuvriers(from, to) {
  const list = activeOuv().map(o => o.code), extra = new Set();
  for (let s = from; s <= to; s++) for (const i of intsOn(s)) if (!list.includes(i.ouvrier)) extra.add(i.ouvrier);
  return [...list, ...[...extra].sort()];
}
function cellHTML(code, s) {
  const ab = absentOn(code, s), list = intsOn(s).filter(i => i.ouvrier === code);
  return `${ab ? `<button class="absent" data-abs="${html(ab.id)}">${html(ab.motif || "Absent")}</button>` : ""}${list.map(cardHTML).join("")}<button class="add" data-add="${html(code)}|${s}" aria-label="Ajouter une intervention">+</button>`;
}

/* ---------- Vue semaine ---------- */
function renderWeek() {
  const mon = S.week, t = today(), days = [0, 1, 2, 3, 4];
  if (intsOn(mon + 5).length) days.push(5);
  const ouvs = weekOuvriers(mon, mon + 6);
  const zones = [...new Set(S.data.ch.map(c => c.zone).filter(z => z !== ""))].sort();
  const all = []; for (let s = mon; s <= mon + 6; s++) all.push(...intsOn(s));
  const warns = []; for (const i of all) for (const w of conflicts(i)) warns.push(`${fS(i.date)} · ${i.ouvrier} · ${splitKey(i.chantier).name} : ${w}`);
  for (const k of new Set(all.filter(i => i.statut !== "Annulé").map(i => i.chantier))) { const c = chOf(k); if (c && Number(c.jours) > 0 && (S.ix.planned.get(k) || 0) > Number(c.jours)) warns.push(`${c.nom} : ${S.ix.planned.get(k)} jours planifiés pour ${c.jours} prévus.`); }
  const free = []; for (const d of days.filter(d => d < 5)) for (const o of activeOuv()) { const s = mon + d; if (!intsOn(s).some(i => i.ouvrier === o.code && i.statut !== "Annulé") && !absentOn(o.code, s) && !ferieOn(s).length) free.push(`${fS(s)} ${o.code}`); }
  let h = demoBanner() + `<div class="whead"><div><h2>Semaine ${isoWeek(mon)}</h2><div class="rng">${fmt(mon, { day: "numeric", month: "long" })} – ${fmt(mon + 4, { day: "numeric", month: "long", year: "numeric" })}</div></div>
    <div class="nav"><button class="iconbtn" data-wk="-7" aria-label="Semaine précédente">‹</button><button class="btn ghost sm" data-wk="0">Aujourd'hui</button><button class="iconbtn" data-wk="7" aria-label="Semaine suivante">›</button>
    <input type="date" id="wkDate" value="${iso(mon)}" aria-label="Aller à la date"></div></div>
    <div class="row"><select id="zoneSel" aria-label="Zone"><option value="">Toutes les zones</option>${zones.map(z => `<option value="${z}"${String(z) === S.zone ? " selected" : ""}>Zone ${z}</option>`).join("")}</select>
    <button class="btn ghost sm" id="copyPrev">Copier la semaine précédente</button><button class="btn ghost sm" id="absNew">Absence</button><button class="btn ghost sm" id="printBtn">Imprimer / PDF</button></div>`;
  if (warns.length || free.length) h += `<details class="alerts"${warns.length ? " open" : ""}><summary>${warns.length} alerte(s) · ${free.length} jour(s)-ouvrier libre(s)</summary><ul>${warns.map(w => `<li>${html(w)}</li>`).join("")}${free.length ? `<li class="muted">Libres : ${html(free.join(", "))}</li>` : ""}</ul></details>`;
  if (S.wide) {
    h += `<div class="gridwrap"><table class="wk"><colgroup><col style="width:96px">${days.map(() => "<col>").join("")}</colgroup><thead><tr><th class="who">Ouvrier</th>`;
    for (const d of days) { const s = mon + d, f = ferieOn(s); h += `<th class="${s === t ? "today" : ""}${f.length ? " fer" : ""}" title="${html(f.map(x => x.nom + " (" + x.cantons + ")").join(", "))}">${DL[d]}<small>${fD(s)}${f.length ? " · " + html(f[0].nom) : ""}</small></th>`; }
    h += `</tr></thead><tbody>`;
    for (const o of ouvs) {
      h += `<tr><th class="who">${html(o)}<small>${html(ouvName(o) !== o ? ouvName(o) : "")}</small><button class="lnk" data-route="${html(o)}">Feuille de route</button></th>`;
      for (const d of days) { const s = mon + d; h += `<td class="cell${s === t ? " today" : ""}${ferieOn(s).length ? " fer" : ""}" data-drop="${html(o)}|${s}"><div class="stack">${cellHTML(o, s)}</div></td>`; }
      h += `</tr>`;
    }
    h += `</tbody></table></div>`;
  } else {
    for (const d of days) {
      const s = mon + d, f = ferieOn(s);
      h += `<section class="day"><h3 class="${s === t ? "today" : ""}">${DL[d]} <small>${fD(s)}${f.length ? " · férié : " + html(f.map(x => x.nom).join(", ")) : ""}</small></h3>`;
      for (const o of ouvs) h += `<div class="orow"><div class="on" title="${html(ouvName(o))}">${html(o)}</div><div class="stack" data-drop="${html(o)}|${s}">${cellHTML(o, s)}</div></div>`;
      h += `</section>`;
    }
    h += `<div class="row">${ouvs.map(o => `<button class="btn ghost sm" data-route="${html(o)}">Feuille de route ${html(o)}</button>`).join("")}</div>`;
  }
  $("#main").innerHTML = h;
  $("#wkDate").onchange = e => { const s = unIso(e.target.value); if (s !== "") { S.week = monOf(s); render(); } };
  $("#zoneSel").onchange = e => { S.zone = e.target.value; render(); };
  $("#copyPrev").onclick = copyPrevWeek;
  $("#absNew").onclick = () => openAbsence({ ouvrier: activeOuv()[0]?.code || "", du: nextWork(Math.max(S.week, today())), au: "" });
  $("#printBtn").onclick = () => openPrintDialog({ from: S.week, to: S.week + 4 });
}

/* ---------- Vue mois ---------- */
function renderMonth() {
  const m0 = S.month, d0 = sDate(m0), y = d0.getUTCFullYear(), mo = d0.getUTCMonth();
  const mEnd = Math.round((Date.UTC(y, mo + 1, 1) - EPOCH) / DAY) - 1, t = today();
  const chq = norm(S.moCh);
  let h = demoBanner() + `<div class="whead"><div><h2>${fmt(m0, { month: "long", year: "numeric" })}</h2></div>
   <div class="nav"><button class="iconbtn" data-mo="-1" aria-label="Mois précédent">‹</button><button class="btn ghost sm" data-mo="0">Ce mois</button><button class="iconbtn" data-mo="1" aria-label="Mois suivant">›</button></div></div>
   <div class="row"><select id="moOuv" aria-label="Ouvrier"><option value="">Tous les ouvriers</option>${weekOuvriers(m0, mEnd).map(o => `<option${o === S.moOuv ? " selected" : ""}>${html(o)}</option>`).join("")}</select>
   <input type="search" id="moCh" placeholder="Filtrer par chantier" value="${html(S.moCh)}"></div>
   <div class="gridwrap"><table class="mo"><thead><tr>${DL.slice(0, 5).map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>`;
  for (let w = monOf(m0); w <= mEnd; w += 7) {
    h += "<tr>";
    for (let k = 0; k < 5; k++) {
      const s = w + k, inM = s >= m0 && s <= mEnd, f = ferieOn(s);
      let items = intsOn(s).filter(i => (!S.moOuv || i.ouvrier === S.moOuv) && (!chq || norm(i.chantier).includes(chq)));
      const ord = weekOuvriers(s, s); items.sort((a, b) => ord.indexOf(a.ouvrier) - ord.indexOf(b.ouvrier));
      const abs = (S.moOuv ? [S.moOuv] : activeOuv().map(o => o.code)).map(c => [c, absentOn(c, s)]).filter(x => x[1]);
      h += `<td class="${inM ? "" : "out"}${f.length ? " fer" : ""}${s === t ? " today" : ""}"><button class="dn" data-goweek="${s}">${sDate(s).getUTCDate()}${f.length ? " · " + html(f[0].nom) : ""}</button>
        ${abs.map(([c, a]) => `<button class="ml ab" data-abs="${html(a.id)}">${html(c)} · ${html(a.motif || "absent")}</button>`).join("")}
        ${items.map(i => `<button class="ml" data-int="${html(i.id)}" style="--h:${hueOf(i.chantier)}" title="${html(i.ouvrier + " · " + i.chantier + (i.remarques ? "\n" + i.remarques : ""))}">${html(i.ouvrier)} · ${html(splitKey(i.chantier).name)}</button>`).join("")}</td>`;
    }
    h += "</tr>";
  }
  $("#main").innerHTML = h + "</tbody></table></div>";
  $("#moOuv").onchange = e => { S.moOuv = e.target.value; render(); };
  $("#moCh").oninput = e => { S.moCh = e.target.value; clearTimeout(renderMonth.t); renderMonth.t = setTimeout(() => { render(); const el = $("#moCh"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); };
}

/* ---------- Demandes ---------- */
function renderDem() {
  const ord = { Haute: 0, Normale: 1, Basse: 2 };
  let list = S.data.dem.slice();
  if (S.demFilter === "open") list = list.filter(d => d.statut === "En attente");
  else if (S.demFilter === "plan") list = list.filter(d => d.statut === "Planifiée");
  list.sort((a, b) => (ord[a.urgence] ?? 1) - (ord[b.urgence] ?? 1) || (a.souhait || 9e9) - (b.souhait || 9e9) || (a.date || 0) - (b.date || 0));
  let h = demoBanner() + `<div class="row"><h2 style="font-size:24px">Demandes SAV</h2><span class="sp"></span><button class="btn signal" id="demNew">Nouvelle demande</button></div>
    <div class="row"><select id="demF"><option value="open">En attente</option><option value="plan">Planifiées</option><option value="all">Toutes</option></select><span class="muted">${list.length} demande(s)</span></div>`;
  if (!list.length) h += `<div class="panel muted">Aucune demande ici. Les chefs de projet ajoutent leurs demandes avec « Nouvelle demande », puis on les planifie depuis cette liste.</div>`;
  for (const d of list) {
    const c = chOf(d.chantier), linked = S.data.int.filter(i => i.demande === d.id && i.statut !== "Annulé").sort((a, b) => a.date - b.date);
    h += `<article class="dcard u-${html(d.urgence)}"><div class="row"><h3>${html(splitKey(d.chantier).name || d.chantier)}</h3><span class="mono muted">${html(splitKey(d.chantier).no)}</span><span class="sp"></span>
      <span class="pill${d.urgence === "Haute" ? " st-Annule" : ""}">${html(d.urgence || "Normale")}</span><span class="pill">${html(d.statut)}</span></div>
      <div style="white-space:pre-line">${html(d.travail)}</div>
      <div class="muted" style="font-size:12px">Demandé ${d.date !== "" ? "le " + fD(d.date) : ""}${d.demandeur ? " par " + html(d.demandeur) : ""}${d.souhait !== "" ? " · souhaité le " + fD(d.souhait) : ""}${d.jours !== "" ? " · " + html(d.jours) + " jour(s) estimé(s)" : ""}${c && c.zone !== "" ? " · zone " + html(c.zone) : ""}</div>

      <div class="row">${d.statut !== "Terminée" ? `<button class="btn sm" data-dplan="${html(d.id)}">Planifier</button>` : ""}<button class="btn ghost sm" data-dedit="${html(d.id)}">Modifier</button>
      ${d.statut !== "Terminée" ? `<button class="btn ghost sm" data-ddone="${html(d.id)}">Marquer terminée</button>` : ""}</div></article>`;
  }
  $("#main").innerHTML = h;
  $("#demF").value = S.demFilter; $("#demF").onchange = e => { S.demFilter = e.target.value; render(); };
  $("#demNew").onclick = () => openDemande(null);
}

/* ---------- Chantiers ---------- */
function chStats() {
  const t = today(), st = new Map();
  for (const i of S.data.int) {
    if (!i.chantier || i.statut === "Annulé") continue;
    let s = st.get(i.chantier); if (!s) st.set(i.chantier, s = { total: 0, fut: 0, next: null, last: null, who: new Set() });
    s.total++;
    if (i.date >= t) { s.fut++; if (s.next === null || i.date < s.next) s.next = i.date; s.who.add(i.ouvrier); }
    else if (s.last === null || i.date > s.last) s.last = i.date;
  }
  return st;
}
function renderCh() {
  const st = chStats(), t = today(), q = norm(S.chQ).split(" ").filter(Boolean);
  const empty = { total: 0, fut: 0, next: null, last: null, who: new Set() };
  let rows = S.data.ch.map(c => ({ c, s: st.get(c.key) || empty }));
  if (S.chFilter === "future") rows = rows.filter(r => r.s.fut > 0);
  if (S.chFilter === "recent") rows = rows.filter(r => r.s.fut > 0 || (r.s.last !== null && t - r.s.last <= 92));
  if (S.chFilter === "active") rows = rows.filter(r => r.c.actif !== "Non");
  if (q.length) rows = rows.filter(r => q.every(w => norm([r.c.key, r.c.adresse, r.c.contact, r.c.client].join(" ")).includes(w)));
  rows.sort((a, b) => (a.s.next ?? 9e9) - (b.s.next ?? 9e9) || (b.s.last ?? 0) - (a.s.last ?? 0) || b.c.key.localeCompare(a.c.key));
  let h = demoBanner() + `<div class="row"><h2 style="font-size:24px">Chantiers</h2><span class="sp"></span><button class="btn signal" id="chNew">Nouveau chantier</button></div>
    <div class="row"><input type="search" id="chQ" placeholder="Nom, numéro, adresse, client…" value="${html(S.chQ)}" style="flex:1;min-width:160px">
    <select id="chF"><option value="future">Interventions à venir</option><option value="recent">Actifs depuis 3 mois</option><option value="active">Chantiers actifs</option><option value="all">Tous</option></select></div>
    <div class="tablewrap"><table class="list"><thead><tr><th>Chantier</th>${S.wide ? "<th>Adresse</th><th>Contact</th>" : ""}<th class="num">Jours</th><th>Prochaine</th></tr></thead><tbody>`;
  for (const { c, s } of rows.slice(0, 300)) {
    const over = Number(c.jours) > 0 && s.total > Number(c.jours);
    h += `<tr class="click" data-ch="${html(c.key)}"><td><span class="mono muted">${html(c.no)}</span><br><b>${html(c.nom)}</b>${!S.wide && !c.adresse ? '<br><span class="miss">adresse manquante</span>' : ""}</td>
      ${S.wide ? `<td>${c.adresse ? html(c.adresse) : '<span class="miss">manquante</span>'}</td><td>${c.contact && !/pas de num/i.test(c.contact) ? html(c.contact) : '<span class="miss">manquant</span>'}</td>` : ""}
      <td class="num">${s.total}${Number(c.jours) > 0 ? ` <span class="pill${over ? " st-Annule" : ""}">/${html(c.jours)}</span>` : ""}</td>
      <td>${s.next !== null ? fS(s.next) + `<br><span class="muted" style="font-size:11px">${html([...s.who].join(", "))}</span>` : (s.last !== null ? `<span class="muted">dernier ${fS(s.last)}</span>` : "")}</td></tr>`;
  }
  if (!rows.length) h += `<tr><td colspan="5" class="muted">Aucun chantier. Changez le filtre ou la recherche.</td></tr>`;
  $("#main").innerHTML = h + `</tbody></table></div>${rows.length > 300 ? `<p class="muted">300 premiers sur ${rows.length}. Affinez la recherche.</p>` : ""}`;
  $("#chF").value = S.chFilter; $("#chF").onchange = e => { S.chFilter = e.target.value; render(); };
  $("#chQ").oninput = e => { S.chQ = e.target.value; clearTimeout(renderCh.t); renderCh.t = setTimeout(() => { render(); const el = $("#chQ"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); };
  $("#chNew").onclick = () => openNewChantier();
}

function renderStats() {

  const work = L.filter(i => !internal(i.chantier));
  const sites = new Set(work.map(i => i.chantier));
  const sum = (a, f) => a.reduce((s, i) => s + (Number(i[f]) || 0), 0);
  const months = Array.from({ length: 12 }, () => 0); for (const i of work) months[sDate(i.date).getUTCMonth()]++;
  const mmax = Math.max(1, ...months);
  const byCh = new Map(); for (const i of work) byCh.set(i.chantier, (byCh.get(i.chantier) || 0) + 1);
  const top = [...byCh].sort((a, b) => b[1] - a[1]).slice(0, 10), tmax = Math.max(1, ...top.map(x => x[1]));

    for (let s = Math.max(y0, Number.isFinite(first) ? first : y0); s <= end; s++) { if (dow(s) > 4 || ferieOn(s).length || absentOn(o.code, s)) continue; avail++; if (days.has(s)) used++; }

  const fact = {}; for (const i of work) { const k = i.facturer || "Non renseigné"; fact[k] = fact[k] || { n: 0, h: 0 }; fact[k].n++; fact[k].h += Number(i.heures) || 0; }

   <div class="kpis"><div class="kpi"><b>${work.length}</b><span>jours-ouvrier sur chantier</span></div><div class="kpi"><b>${sites.size}</b><span>chantiers</span></div>

/* ---------- Éditeur d'intervention ---------- */
function rankedCh(q) {
  const t = today(), score = new Map();
  for (let s = t - 90; s <= t + 60; s++) for (const i of intsOn(s)) score.set(i.chantier, (score.get(i.chantier) || 0) + 1);
  const qq = norm(q).split(" ").filter(Boolean);
  let l = S.data.ch.filter(c => c.actif !== "Non" || qq.length);
  if (qq.length) l = l.filter(c => qq.every(w => norm(c.key + " " + c.adresse + " " + c.client).includes(w)));
  return l.map(c => ({ c, s: score.get(c.key) || 0 })).sort((a, b) => b.s - a.s || b.c.key.localeCompare(a.c.key)).slice(0, 30);
}
function comboHTML(id, val) {
  return `<div class="combo"><input type="text" id="${id}" value="${html(val)}" autocomplete="off" placeholder="Nom ou numéro PRO"><ul class="opts" id="${id}Opts"></ul></div>`;
}
function wireCombo(id, onPick) {
  const inp = $("#" + id), ul = $("#" + id + "Opts");
  const fill = q => { const l = rankedCh(q); ul.innerHTML = l.map((x, k) => `<li data-key="${html(x.c.key)}" class="${k === 0 && q ? "act" : ""}"><span class="mono muted">${html(x.c.no)}</span><span>${html(x.c.nom)}</span>${x.s ? `<em>${x.s} j récents</em>` : ""}</li>`).join("") || `<li class="muted">Aucun chantier. Créez-le avec « Nouveau chantier ».</li>`; };
  inp.addEventListener("input", () => fill(inp.value));
  inp.addEventListener("focus", () => fill(chOf(inp.value) ? "" : inp.value));
  inp.addEventListener("blur", () => setTimeout(() => ul.innerHTML = "", 150));
  ul.addEventListener("mousedown", e => { const li = e.target.closest("li[data-key]"); if (li) { e.preventDefault(); inp.value = li.dataset.key; ul.innerHTML = ""; onPick(li.dataset.key); } });
  inp.addEventListener("keydown", e => {
    const it = [...ul.querySelectorAll("li[data-key]")]; let k = it.findIndex(x => x.classList.contains("act"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); it.forEach(x => x.classList.remove("act")); k = e.key === "ArrowDown" ? Math.min(it.length - 1, k + 1) : Math.max(0, k - 1); it[k]?.classList.add("act"); it[k]?.scrollIntoView({ block: "nearest" }); }
    if (e.key === "Enter" && it.length && inp.value.trim()) { e.preventDefault(); const li = it[Math.max(0, k)]; inp.value = li.dataset.key; ul.innerHTML = ""; onPick(li.dataset.key); }
  });
}

function renderWarn() {

function repeatDates(start, until, ouvrier, onlyFree, skipId) {
  const out = [];
  for (let s = start + 1; s <= until; s++) {
    if (dow(s) > 4 || ferieOn(s).length || absentOn(ouvrier, s)) continue;
    if (onlyFree && intsOn(s).some(i => i.ouvrier === ouvrier && i.id !== skipId && i.statut !== "Annulé")) continue;
    out.push(s);
  }
  return out;
}
async function saveEditor() {
  const e = S.edit, d = draftFromEditor();
  if (d.date === "") { toast("Indiquez une date."); return; }
  if (!d.ouvriers.length) { toast("Choisissez au moins un ouvrier."); return; }
  if (!chOf(d.chantier)) { toast("Choisissez un chantier de la liste, ou créez-le."); return; }
  const base = { chantier: d.chantier, remarques: d.remarques, vehicule: d.vehicule, statut: d.statut, heures: d.heures, km: d.km, facturer: d.facturer, modif: nowStamp() };
  const ops = [], rep = $("#eRep").checked, until = unIso($("#eRepU").value), free = $("#eRepFree").checked;
  const demande = e.isNew ? e.demandeId : e.orig.demande;
  if (e.isNew) {
    for (const o of d.ouvriers) {
      const dates = [d.date, ...(rep && until !== "" ? repeatDates(d.date, until, o, free) : [])];
      for (const s of dates) if (!intsOn(s).some(x => x.ouvrier === o && x.chantier === d.chantier && x.statut !== "Annulé")) ops.push({ t: "int", op: "add", rec: { id: newId("I"), date: s, ouvrier: o, ...base, statut: s === d.date ? d.statut : "Planifié", heures: s === d.date ? d.heures : "", km: s === d.date ? d.km : "", demande, par: S.user } });
    }
    if (demande && S.ix.dem.get(demande)?.statut === "En attente") ops.push({ t: "dem", op: "upd", key: demande, patch: { statut: "Planifiée" } });
  } else {
    ops.push({ t: "int", op: "upd", key: e.orig.id, patch: { date: d.date, ouvrier: d.ouvriers[0], ...base } });
    if (rep && until !== "") for (const s of repeatDates(d.date, until, d.ouvriers[0], free, e.orig.id)) if (!intsOn(s).some(x => x.ouvrier === d.ouvriers[0] && x.chantier === d.chantier && x.statut !== "Annulé")) ops.push({ t: "int", op: "add", rec: { id: newId("I"), date: s, ouvrier: d.ouvriers[0], ...base, statut: "Planifié", heures: "", km: "", demande: e.orig.demande, par: S.user } });
  }

  if (await run(ops, e.isNew ? "ajout" : "modification")) toast(e.isNew ? `${n} intervention(s) créée(s).` : (n > 1 ? `Modifiée et répétée sur ${n - 1} jour(s).` : "Intervention enregistrée."));
}

  if (copy) await run([{ t: "int", op: "add", rec: { ...clone(src), id: newId("I"), date, ouvrier: ouv, statut: "Planifié", heures: "", km: "", par: S.user, modif: nowStamp() } }], "copie");

/* ---------- Copier la semaine précédente ---------- */
function copyPrevWeek() {
  const prev = S.week - 7, ops = []; let skipped = 0;
  for (let k = 0; k < 5; k++) for (const i of intsOn(prev + k)) {
    if (i.statut === "Annulé") continue;
    const s = S.week + k;
    if (absentOn(i.ouvrier, s) || ferieOn(s).length || intsOn(s).some(x => x.ouvrier === i.ouvrier)) { skipped++; continue; }
    ops.push({ t: "int", op: "add", rec: { ...clone(i), id: newId("I"), date: s, statut: "Planifié", heures: "", km: "", facturer: "", par: S.user, modif: nowStamp() } });
  }
  if (!ops.length) { toast("Rien à copier : la semaine précédente est vide ou les jours sont déjà occupés."); return; }
  confirmBox("Copier la semaine " + isoWeek(prev) + " ?", `${ops.length} intervention(s) seront recopiées sur la semaine ${isoWeek(S.week)}. ${skipped ? skipped + " ignorée(s) car le jour est déjà occupé, férié ou l'ouvrier absent." : ""}`, "Copier", () => run(ops, "copie de semaine"));
}

/* ---------- Fiche chantier ---------- */
function openChantier(key) {
  const c = S.ix.ch.get(key); if (!c) return;

/* ---------- Feuille de route, envoi, impression, calendrier ---------- */
function routeText(code, from, to) {
  const lines = [`Planning SAV – ${code}${ouvName(code) !== code ? " (" + ouvName(code) + ")" : ""} – du ${fD(from)} au ${fD(to)}`, ""];
  for (let s = from; s <= to; s++) {
    const ab = absentOn(code, s), list = intsOn(s).filter(i => i.ouvrier === code && i.statut !== "Annulé"), f = ferieOn(s);
    if (dow(s) > 4 && !list.length) continue;
    if (ab) { lines.push(`${fS(s)} · ${ab.motif || "Absent"}`, ""); continue; }
    if (!list.length) { lines.push(`${fS(s)} · ${f.length ? "Férié (" + f[0].nom + ")" : "rien de prévu"}`, ""); continue; }
    for (const i of list) {
      const c = chOf(i.chantier); lines.push(`${fS(s)} · ${i.chantier}`);
      if (c && !internal(c.key)) { if (c.adresse) lines.push(`  Adresse : ${c.adresse}`); if (c.contact) lines.push(`  Contact : ${c.contact}`); if (c.recette) lines.push(`  Recette : ${c.recette}`); }
      if (i.remarques) lines.push(`  À faire : ${i.remarques.replace(/\n/g, " / ")}`);
      if (i.vehicule) lines.push(`  Véhicule : ${i.vehicule}`);
      const mates = intsOn(s).filter(x => x.chantier === i.chantier && x.ouvrier !== code && x.statut !== "Annulé").map(x => x.ouvrier);
      if (mates.length) lines.push(`  Avec : ${mates.join(", ")}`);
      lines.push("");
    }
  }
  return lines.join("\n").trim();
}

    for (let s = from; s <= to; s++) {
      const ab = absentOn(code, s), list = intsOn(s).filter(i => i.ouvrier === code && i.statut !== "Annulé"), f = ferieOn(s);
      if (dow(s) > 4 && !list.length) continue;
      if (ab) { rows += `<tr class="abs"><td>${fS(s)}</td><td colspan="5">${html(ab.motif || "Absent")}</td></tr>`; continue; }
      if (!list.length) { rows += `<tr><td>${fS(s)}</td><td colspan="5" style="color:#777">${f.length ? "Férié : " + html(f[0].nom) : "—"}</td></tr>`; continue; }
      for (const i of list) {
        const c = chOf(i.chantier) || {}; evs.push(i);
        rows += `<tr><td>${fS(s)}</td><td><b>${html(i.chantier)}</b></td><td>${html(c.adresse)}</td><td>${html(c.contact)}</td><td style="white-space:pre-line">${html(i.remarques)}${c.recette ? `<br><i>Recette : ${html(c.recette)}</i>` : ""}</td><td>${html(i.vehicule)}</td></tr>`;
      }
    }
    body += `<section class="page"><div class="hd"><div><h1>Planning SAV – ${html(code)}${ouvName(code) !== code ? " · " + html(ouvName(code)) : ""}</h1><div class="sub">Du ${fD(from)} au ${fD(to)}</div></div><div class="brand">MFP Préfabrication SA</div></div>
      <table><thead><tr><th style="width:16mm">Jour</th><th>Chantier</th><th>Adresse</th><th>Contact</th><th>À faire</th><th style="width:20mm">Véhicule</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="sub">Imprimé le ${fD(today())}${S.user ? " par " + html(S.user) : ""}</div></section>`;
  }
  openPrint({ title: `Planning SAV ${ouvs.join(", ")} ${fD(from)}`, html: `<style>${PRINT_CSS}</style>${body}`, ics: evs.length ? icsFor(evs) : "", icsName: `planning-sav-${ouvs.join("-")}-${iso(from)}.ics` });
}
function printFiches(list) {
  list = list.slice().sort((a, b) => a.date - b.date || a.chantier.localeCompare(b.chantier));
  const groups = new Map(); for (const i of list) { const k = i.date + "|" + i.chantier; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); }
  let body = "";
  for (const g of groups.values()) {
    const i = g[0], c = chOf(i.chantier) || {}, team = [...new Set([...g, ...intsOn(i.date).filter(x => x.chantier === i.chantier && x.statut !== "Annulé")].map(x => x.ouvrier))];
    const dem = i.demande ? S.ix.dem.get(i.demande) : null;
    const cb = v => `<span class="cb${i.facturer === v ? " x" : ""}"></span>${v}`;
    body += `<section class="page"><div class="hd"><div><h1>Fiche d'intervention SAV</h1><div class="sub">MFP Préfabrication SA · Route des Helvètes 13 · 2074 Marin-Epagnier</div></div><div class="brand">${fD(i.date)}</div></div>
     <table><tr><th style="width:42mm">N° affaire – chantier</th><td><b>${html(i.chantier)}</b></td></tr><tr><th>Adresse</th><td>${html(c.adresse)}</td></tr>
      <tr><th>Contact sur chantier</th><td>${html(c.contact)}</td></tr><tr><th>Client</th><td>${html(c.client)}</td></tr><tr><th>Recette / finition</th><td>${html(c.recette)}</td></tr>
      <tr><th>Équipe</th><td>${html(team.join(", "))}${i.vehicule ? " · véhicule : " + html(i.vehicule) : ""}</td></tr>
      <tr><th>Travail demandé</th><td style="white-space:pre-line">${html([dem?.travail, ...new Set(g.map(x => x.remarques).filter(Boolean))].filter(Boolean).join("\n"))}</td></tr></table>
     <h2>Rapport des travaux effectués</h2>
     <table><thead><tr><th>Désignation (détailler le travail)</th><th style="width:18mm">N° élément</th><th style="width:18mm">Personnes</th><th style="width:18mm">Km</th><th style="width:18mm">Heures</th></tr></thead><tbody>${"<tr><td style='height:9mm'></td><td></td><td></td><td></td><td></td></tr>".repeat(6)}</tbody></table>
     <div>Travaux à facturer : ${cb("MFP")} ${cb("Client")} ${cb("Transport")}</div>
     <h2>Remarques / matériel utilisé</h2><div class="box"></div>
     <div class="sig"><div>Signature ouvrier MFP</div><div>Signature client / direction des travaux</div></div></section>`;
  }
  openPrint({ title: `Fiches SAV (${groups.size})`, html: `<style>${PRINT_CSS}</style>${body}` });
}
function icsFor(list) {
  const e = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const d8 = s => { const d = sDate(s); return `${d.getUTCFullYear()}${p2(d.getUTCMonth() + 1)}${p2(d.getUTCDate())}`; };
  const fold = l => { const out = []; while (l.length > 74) { out.push(l.slice(0, 74)); l = " " + l.slice(74); } out.push(l); return out.join("\r\n"); };
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//MFP Prefabrication//Planning SAV//FR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  for (const i of list) {
    const c = chOf(i.chantier) || {};
    L.push("BEGIN:VEVENT", `UID:${i.id}@planning-sav`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d8(i.date)}`, `DTEND;VALUE=DATE:${d8(i.date + 1)}`,
      fold(`SUMMARY:${e("SAV " + (splitKey(i.chantier).name || i.chantier))}`), fold(`LOCATION:${e(c.adresse)}`),
      fold(`DESCRIPTION:${e([i.chantier, i.remarques && "À faire : " + i.remarques, c.contact && "Contact : " + c.contact, i.vehicule && "Véhicule : " + i.vehicule].filter(Boolean).join("\n"))}`), "END:VEVENT");
  }
  L.push("END:VCALENDAR"); return L.join("\r\n");
}
function printPage(p) {
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${html(p.title)}</title><style>.tb{position:sticky;top:0;background:#151615;color:#fff;padding:8px 12px;display:flex;gap:8px;font-family:Segoe UI,Arial,sans-serif;z-index:2}.tb button{background:#F2B200;border:0;border-radius:4px;padding:6px 12px;font-weight:600;cursor:pointer}@media print{.tb{display:none}}</style></head>
  <body><div class="tb"><button onclick="window.print()">Imprimer / PDF</button>${p.ics ? `<button id="ics">Fichier calendrier (.ics)</button>` : ""}</div>${p.html}
  ${p.ics ? `<script>document.getElementById("ics").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([${JSON.stringify(p.ics).replace(/</g, "\\u003c")}],{type:"text/calendar"}));a.download=${JSON.stringify(p.icsName || "planning.ics")};document.body.appendChild(a);a.click();}<\/script>` : ""}</body></html>`;
}
function openPrint(p) {
  const dialogOk = S.inOffice && Office.context.ui?.displayDialogAsync && Office.context.requirements.isSetSupported("DialogApi", "1.2");
  if (dialogOk) {
    Office.context.ui.displayDialogAsync(new URL("print.html", location.href).href, { height: 85, width: 70, promptBeforeOpen: false }, res => {
      if (res.status !== Office.AsyncResultStatus.Succeeded) { fallbackPrint(p); return; }
      const dlg = res.value;
      dlg.addEventHandler(Office.EventType.DialogMessageReceived, a => {
        if (a.message !== "ready") return;
        const s = JSON.stringify(p), n = Math.max(1, Math.ceil(s.length / 20000));
        for (let k = 0; k < n; k++) dlg.messageChild(JSON.stringify({ i: k, n, d: s.slice(k * 20000, (k + 1) * 20000) }));
      });
    });
    return;
  }
  fallbackPrint(p);
}
function fallbackPrint(p) {
  let w = null; try { w = window.open("", "_blank"); } catch (e) { }
  if (w) { w.document.open(); w.document.write(printPage(p)); w.document.close(); return; }
  openModal(p.title, `<iframe id="pf" title="Aperçu" style="width:100%;height:60vh;border:1px solid var(--line);background:#fff"></iframe><div class="row end"><button class="btn" id="pfP">Imprimer</button></div>`);
  $("#pf").srcdoc = printPage(p); $("#pfP").onclick = () => { try { $("#pf").contentWindow.print(); } catch (e) { toast("L'impression est bloquée ici. Ouvrez le complément dans Excel."); } };
}

/* ---------- Réglages ---------- */
function openSettings(first) {
  openModal(first ? "Bienvenue dans Planning SAV" : "Réglages", `${first ? `<p style="margin:0">Indiquez vos initiales : elles sont enregistrées sur chaque intervention que vous planifiez.</p>` : ""}
   <label class="field"><span>Vos initiales</span><input type="text" id="sUser" value="${html(S.user)}" maxlength="6" placeholder="JD"></label>
   <div class="field"><span>Jours fériés à afficher</span><div class="chips" id="sCant">${CANTONS.map(c => `<button class="chip" data-c="${c}" aria-pressed="${S.cantons.includes(c)}">${c}</button>`).join("")}</div></div>
   <div class="field"><span>Affichage</span><div class="chips" id="sTheme">${[["light", "Clair"], ["dark", "Sombre"], ["auto", "Comme Windows"]].map(([v, l]) => `<button class="chip" data-th="${v}" aria-pressed="${ls.get("sav_theme", "light") === v}">${l}</button>`).join("")}</div></div>
   <div class="row end"><button class="btn" id="sOk">Enregistrer</button></div>`);
  $("#sTheme").onclick = e => { const b = e.target.closest("[data-th]"); if (!b) return; $("#sTheme").querySelectorAll("[data-th]").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  $("#sCant").onclick = e => { const b = e.target.closest("[data-c]"); if (b) b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); };
  $("#sOk").onclick = () => {
    S.user = $("#sUser").value.trim().toUpperCase(); ls.set("sav_user", S.user);
    S.cantons = [...$("#sCant").querySelectorAll("[aria-pressed=true]")].map(b => b.dataset.c); ls.set("sav_cantons", S.cantons.join(" "));
    const th = $("#sTheme [aria-pressed=true]")?.dataset.th || "light"; ls.set("sav_theme", th);
    if (th === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", th);
    if (S.mode === "full") tellParent({ t: "prefs", prefs: prefsNow() });
    closeModal(); render();
  };
}

/* ---------- Événements globaux ---------- */
$("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; S.view = b.dataset.view; ls.set("sav_view", S.view); render(); window.scrollTo(0, 0); });
$("#undoBtn").onclick = undo;
$("#reloadBtn").onclick = () => reload();
$("#setBtn").onclick = () => openSettings(false);
$("#mClose").onclick = closeModal;
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("#scrim").onclick = closeSheet;
document.addEventListener("click", e => {
  const ext = e.target.closest("a[data-ext]"); if (ext) { e.preventDefault(); openUrl(ext.href); return; }
  const g = sel => e.target.closest(sel);
  let el;
  if (g("[data-close]")) { closeSheet(); return; }
  if ((el = g("[data-int]"))) { const i = S.ix.byId.get(el.dataset.int); if (i) { closeModal(); openEditor(i); } return; }
  if ((el = g("[data-add]"))) { const [o, s] = el.dataset.add.split("|"); openEditor({ new: true, date: Number(s), ouvriers: [o] }); return; }
  if ((el = g("[data-abs]"))) { const a = S.data.abs.find(x => x.id === el.dataset.abs); if (a) openAbsence(a); return; }
  if ((el = g("[data-route]"))) { openRoute(el.dataset.route); return; }
  if ((el = g("[data-ch]"))) { closeModal(); openChantier(el.dataset.ch); return; }
  if ((el = g("[data-wk]"))) { const v = Number(el.dataset.wk); S.week = v ? S.week + v : monOf(today()); render(); return; }
  if ((el = g("[data-mo]"))) { const v = Number(el.dataset.mo), d = sDate(S.month); S.month = v ? Math.round((Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + v, 1) - EPOCH) / DAY) : (() => { const t = sDate(today()); return Math.round((Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), 1) - EPOCH) / DAY); })(); render(); return; }
  if ((el = g("[data-goweek]"))) { S.week = monOf(Number(el.dataset.goweek)); S.view = "week"; render(); return; }
  if ((el = g("[data-dplan]"))) { planDemande(el.dataset.dplan); return; }
  if ((el = g("[data-dedit]"))) { openDemande(S.ix.dem.get(el.dataset.dedit)); return; }
  if ((el = g("[data-ddone]"))) { run([{ t: "dem", op: "upd", key: el.dataset.ddone, patch: { statut: "Terminée" } }], "demande terminée"); return; }
  if ((el = g("[data-ferdel]"))) { const d = Number(el.dataset.ferdel); confirmBox("Retirer ce férié ?", fD(d), "Retirer", () => run([{ t: "fer", op: "del", key: d }], "férié retiré"), true); return; }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-ed]"); if (!el) return;
  const [t, key, f] = el.dataset.ed.split("|"); let v = el.value.trim(); if ((TBL[t].nums || []).includes(f)) v = v === "" ? "" : Number(v);
  run([{ t, op: "upd", key, patch: { [f]: v } }], "modification équipe");
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === "Escape") { if (!$("#modal").hidden) closeModal(); else if (!$("#sheet").hidden) closeSheet(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !$("#sheet").hidden && $("#eSave")) { e.preventDefault(); saveEditor(); }
});
new ResizeObserver(() => { const w = $("#main").clientWidth >= 700; if (w !== S.wide && S.data) render(); }).observe($("#main"));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.live && Date.now() - S.lastLoad > 60000) reload(true); });

/* ---------- Plein écran : grande fenêtre reliée au panneau ----------
   La fenêtre n'a pas accès à Excel : elle envoie ses lectures et écritures au panneau,
   qui les exécute dans le classeur puis répond. Messages découpés en morceaux. */
const CHUNK = 16000;
const Bridge = { dlg: null, bufs: {} };
function sendChunks(send, obj) {
  const s = JSON.stringify(obj), id = Math.random().toString(36).slice(2), n = Math.max(1, Math.ceil(s.length / CHUNK));
  for (let k = 0; k < n; k++) send(JSON.stringify({ k: "part", id, i: k, n, d: s.slice(k * CHUNK, (k + 1) * CHUNK) }));
}
function recvChunk(raw, cb) {
  let m; try { m = JSON.parse(raw); } catch (e) { return; }
  if (!m || m.k !== "part") return;
  const b = Bridge.bufs[m.id] || (Bridge.bufs[m.id] = { n: m.n, p: [], got: 0 });
  if (b.p[m.i] === undefined) { b.p[m.i] = m.d; b.got++; }
  if (b.got === b.n) { delete Bridge.bufs[m.id]; cb(JSON.parse(b.p.join(""))); }
}
const toDlg = obj => { if (Bridge.dlg) try { sendChunks(x => Bridge.dlg.messageChild(x), obj); } catch (e) { console.warn(e); } };
const prefsNow = () => ({ user: S.user, cantons: S.cantons, theme: ls.get("sav_theme", "light") });
function applyPrefs(p, save) {
  if (!p) return;
  if (typeof p.user === "string") S.user = p.user;
  if (Array.isArray(p.cantons)) S.cantons = p.cantons;
  if (p.theme) { if (p.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", p.theme); }
  if (save) { ls.set("sav_user", S.user); ls.set("sav_cantons", S.cantons.join(" ")); if (p.theme) ls.set("sav_theme", p.theme); }
}
function openFull() {
  if (Bridge.dlg) return;
  Office.context.ui.displayDialogAsync(new URL("taskpane.html?mode=full", location.href).href, { height: 100, width: 100, promptBeforeOpen: false }, res => {
    if (res.status !== Office.AsyncResultStatus.Succeeded) {
      openModal("Plein écran impossible", `<p>${html(res.error?.message || "La fenêtre n'a pas pu s'ouvrir.")}</p><p class="muted">Autorisez les fenêtres pop-up pour ce site dans le navigateur, puis réessayez.</p>`); return;
    }
    Bridge.dlg = res.value; S.fullOpen = true; render();
    Bridge.dlg.addEventHandler(Office.EventType.DialogMessageReceived, a => recvChunk(a.message, onDialogMsg));
    Bridge.dlg.addEventHandler(Office.EventType.DialogEventReceived, () => onFullClosed());
  });
}
function onFullClosed() { Bridge.dlg = null; S.fullOpen = false; reload(true); }
async function onDialogMsg(m) {
  if (m.t === "load") {
    try { const data = await OfficeStore.loadAll(); toDlg({ t: "res", rid: m.rid, ok: true, data, prefs: prefsNow() }); }
    catch (e) { toDlg({ t: "res", rid: m.rid, ok: false, err: e.message, missing: e.missing }); }
  } else if (m.t === "apply") {
    try {
      S.lastWrite = Date.now(); await OfficeStore.apply(m.ops); S.lastWrite = Date.now();
      toDlg({ t: "res", rid: m.rid, ok: true });
      clearTimeout(onDialogMsg.t); onDialogMsg.t = setTimeout(() => reload(true), 1500);
    } catch (e) { toDlg({ t: "res", rid: m.rid, ok: false, err: e.message }); }
  } else if (m.t === "prefs") applyPrefs(m.prefs, true);
  else if (m.t === "close") { try { Bridge.dlg && Bridge.dlg.close(); } catch (e) { } onFullClosed(); }
}
const BridgeStore = {
  pending: {}, n: 0,
  init() {
    return new Promise(res => Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, a => recvChunk(a.message, m => {
      if (m.t === "res") { const p = this.pending[m.rid]; if (!p) return; delete this.pending[m.rid]; clearTimeout(p.to); if (m.ok) p.res(m); else { const e = new Error(m.err); e.missing = m.missing; p.rej(e); } }
      else if (m.t === "changed") { if (Date.now() - S.lastWrite > 2500) reload(true); }
    }), () => res()));
  },
  call(msg) {
    return new Promise((res, rej) => {
      const rid = "q" + (++this.n);
      const to = setTimeout(() => { if (this.pending[rid]) { delete this.pending[rid]; rej(new Error("Le panneau Planning SAV dans Excel ne répond pas. Vérifiez qu'il est toujours ouvert, puis réessayez.")); } }, 45000);
      this.pending[rid] = { res, rej, to };
      sendChunks(x => Office.context.ui.messageParent(x), { ...msg, rid });
    });
  },
  async loadAll() { const r = await this.call({ t: "load" }); applyPrefs(r.prefs, false); return r.data; },
  async apply(ops) { await this.call({ t: "apply", ops }); },
  watch() { }
};
const tellParent = obj => { try { sendChunks(x => Office.context.ui.messageParent(x), obj); } catch (e) { } };

/* ---------- Démarrage ---------- */
let started = false;
const FULL = new URLSearchParams(location.search).get("mode") === "full";
async function start(mode) {
  if (started) return; started = true;
  S.mode = mode; S.inOffice = mode === "panel"; S.live = mode !== "demo";
  S.store = mode === "panel" ? OfficeStore : mode === "full" ? BridgeStore : MemStore;
  const inOffice = S.inOffice;
  if (mode === "full") {
    await BridgeStore.init();
    $("#closeFullBtn").hidden = false; $("#closeFullBtn").onclick = () => tellParent({ t: "close" });
    await reload();
    if (!S.user) openSettings(true);
    return;
  }
  if (inOffice && Office.context.requirements.isSetSupported("DialogApi", "1.2")) { $("#fullBtn").hidden = false; $("#fullBtn").onclick = openFull; }
  if (inOffice && !Office.context.requirements.isSetSupported("ExcelApi", "1.7")) {
    $("#main").innerHTML = `<div class="center"><h2>Version d'Excel trop ancienne</h2><p>Ce complément demande Excel 2019 ou plus récent, Microsoft 365 ou Excel en ligne.</p></div>`; return;
  }
  await reload();
  if (inOffice) {
    S.store.watch(src => {
      if (Date.now() - S.lastWrite < 2500) return;
      clearTimeout(start.t); start.t = setTimeout(() => { reload(true); toDlg({ t: "changed" }); }, 1200);
    });
    setInterval(() => { if ((document.visibilityState === "visible" || S.fullOpen) && Date.now() - S.lastWrite > 5000) { reload(true); toDlg({ t: "changed" }); } }, 120000);
  }
  if (!S.user && inOffice) openSettings(true);
}
if (typeof Office !== "undefined" && Office.onReady) {
  Office.onReady(info => start(FULL ? "full" : (info && info.host === Office.HostType.Excel ? "panel" : "demo")));
  setTimeout(() => { if (started) return;
    $("#main").innerHTML = `<div class="center"><h2>Excel ne répond pas</h2><p>Le complément n'a pas pu se connecter au classeur.</p><div class="row"><button class="btn" onclick="location.reload()">Réessayer</button><button class="btn ghost" id="goDemo">Voir l'aperçu de démonstration</button></div></div>`;
    $("#goDemo").onclick = () => start("demo"); }, 10000);
} else start("demo");
</script>
